<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VitalPeak" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .calendar-entry{background:var(--entry-color,#1976D2)!important;border-color:var(--entry-color,#1976D2)!important;color:#fff!important}
      .calendar-entry button{color:#fff!important}
      .calendar-workout{appearance:none;background:transparent;border:0;padding:0;margin:0;color:#fff;font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
      .exercise-close{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:80;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#163a43;font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);padding:0;cursor:pointer}
      .exercise-close:active{transform:scale(.96)}
      .movement-cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;border:1px solid #86cfc3;background:#e8f7f3;color:#163a43;font-weight:800;font-size:15px;cursor:pointer}
      .movement-cta small{font-weight:600;opacity:.75}
      .planned-workout-list{display:grid;gap:10px;margin-top:12px}
      .planned-exercise{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid rgba(22,58,67,.12);border-radius:14px;background:#fff}
      .planned-exercise button{flex:0 0 auto}
      .ppm-hint{font-size:12px;color:#64757a;margin-top:4px}
      .help-backdrop{position:fixed;inset:0;z-index:250;background:rgba(9,30,35,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
      .help-card{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);color:#163a43}
      .help-card h2{margin:4px 0 8px;font-size:28px}
      .help-card>p{margin:0 0 18px;color:#61777d}
      .help-items{display:grid;gap:11px;margin:14px 0 22px}
      .help-item{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:start;padding:11px;border-radius:14px;background:#f3f8f6}
      .help-item strong{display:block;margin-bottom:2px}
      .help-item span{font-size:14px;color:#60757a}
      .help-icon{width:38px;height:38px;border-radius:11px;background:#d9f3ec;display:grid;place-items:center;font-size:20px}
      .mobile-month{margin-top:8px}
      .mobile-month .month-day{appearance:none;min-height:58px;padding:7px 4px;border:1px solid #d8e7e3;border-radius:12px;background:#fff;color:#102e38;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer}
      .mobile-month .month-day.blank{visibility:hidden}
      .mobile-month .month-day.today{border:2px solid #16a98e;padding:6px 3px}
      .mobile-month .month-day.selected{background:#e9f8f4;box-shadow:0 0 0 2px rgba(22,169,142,.18)}
      .mobile-month .month-day b{font-size:13px;line-height:1}
      .calendar-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;min-height:8px}
      .calendar-dot{width:7px;height:7px;border-radius:50%;display:block}
      .selected-day-panel{margin-top:16px;padding:16px;border-radius:20px;background:#fff;border:1px solid #d8e7e3;box-shadow:0 8px 22px rgba(16,46,56,.06)}
      .selected-day-panel h2{margin:2px 0 3px;font-size:20px}
      .selected-day-panel>p{margin:0 0 12px}
      .day-workout-card{display:grid;grid-template-columns:5px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-top:1px solid #e1ece9}
      .day-workout-color{width:5px;align-self:stretch;border-radius:99px;background:var(--workout-color)}
      .day-workout-card b{display:block;font-size:14px}
      .day-workout-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
      .day-workout-actions button{min-height:36px;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}
      .calendar-add{margin-top:12px}
      .calendar-add select{width:100%;min-height:46px;border:1px solid #cddfda;background:#fbfefd;border-radius:13px;padding:10px;color:#102e38}
      .edit-workout-note{padding:10px 12px;border-radius:12px;background:#fff5dc;color:#725313;font-size:12px;margin:10px 0 14px}
      .edit-exercise-row{padding:14px 0;border-top:1px solid #d8e7e3}
      .edit-exercise-row:first-child{border-top:0}
      .edit-exercise-grid{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:end}
      .edit-exercise-grid .exercise-select{grid-column:1/-1}
      .edit-exercise-grid label{display:grid;gap:4px;font-size:11px;font-weight:800;color:#60757a}
      .edit-exercise-grid select,.edit-exercise-grid input{width:100%;min-height:42px;border:1px solid #cddfda;border-radius:11px;background:#fbfefd;padding:8px;color:#102e38;font-size:14px}
      .edit-exercise-actions{display:flex;justify-content:flex-end;margin-top:8px}
      .remove-exercise{background:#fdecef;color:#b43b4c;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}
      .add-exercise-card{margin-top:14px;padding:14px;border-radius:14px;background:#eef8f5}
      .add-exercise-form{display:grid;gap:8px}
      .add-exercise-form select,.add-exercise-form input{width:100%;min-height:44px;border:1px solid #cddfda;border-radius:11px;background:#fff;padding:8px;color:#102e38}
      @media(max-width:480px){
        .month-weekdays{gap:3px}
        .mobile-month{gap:3px}
        .day-workout-card{grid-template-columns:5px 1fr}
        .day-workout-actions{grid-column:2;justify-content:flex-start}
        .edit-exercise-grid{grid-template-columns:1fr 1fr}
        .edit-exercise-grid .exercise-select{grid-column:1/-1}
      }
    </style>
    <title>VitalPeak</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Navegación principal">
      <button data-route="today" class="active" aria-label="Hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></button>
      <button data-route="train" aria-label="Entrenar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4m18-4v4M5 8v8m14-8v8M8 12h8"/><path d="M1 9h4v6H1zm18 0h4v6h-4z"/></svg><span>Entrenar</span></button>
      <button data-route="routines" aria-label="Rutinas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zm0 7h6m-6 4h6m-6 4h4"/></svg><span>Rutinas</span></button>
      <button data-route="planner" aria-label="Calendario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>Calendario</span></button>
      <button data-route="progress" aria-label="Progreso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16"/><path d="m7 15 4-4 3 2 5-6"/></svg><span>Progreso</span></button>
      <button data-route="account" aria-label="Cuenta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4.1 3.3-6 8-6s7.3 1.9 8 6"/></svg><span>Cuenta</span></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
    <script type="module">
      const BUILD_VERSION = '66';
      const catalogResponse = await fetch(`./catalog-data.js?v=${BUILD_VERSION}`, {cache: 'no-store'});
      if (!catalogResponse.ok) throw new Error('No se pudo cargar el catálogo de ejercicios');
      const catalogBlob = new Blob([await catalogResponse.text()], {type: 'text/javascript'});
      const catalogUrl = URL.createObjectURL(catalogBlob);
      try { await import(catalogUrl); } finally { URL.revokeObjectURL(catalogUrl); }

      const response = await fetch(`./app.js?v=${BUILD_VERSION}`, {cache: 'no-store'});
      if (!response.ok) throw new Error('No se pudo cargar VitalPeak');
      let source = await response.text();

      source = source.replace(
        'const today = () => new Date().toISOString().slice(0, 10);',
        'const localISODate = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;\nconst today = () => localISODate(new Date());'
      );
      source = source.replace(
        'function isoDate(d) { return new Date(d).toISOString().slice(0,10); }',
        'function isoDate(d) { return localISODate(new Date(d)); }'
      );
      source = source.replace(
        'function plannedRoutine(iso=today()) { const list=plannedRoutines(iso),index=Math.min(Number(state.todaySessionIndex||0),Math.max(0,list.length-1));return list[index]||null; }',
        'function plannedRoutine(iso=today()) { const list=plannedRoutines(iso),index=Math.min(Number(state.todaySessionIndex||0),Math.max(0,list.length-1));return list[index]||null; }\nfunction sessionRoutine(draft=state._draft){if(draft?.routineId){const r=routineById(draft.routineId);if(r){const day=Number(String(draft.routineKey||"").split("::")[1]||0);return {...r,activeDay:day}}}return plannedRoutine(draft?.date||today())||activeRoutine()}\nfunction sessionItems(draft=state._draft){return items(sessionRoutine(draft))}\nconst CALENDAR_COLORS=["#D32F2F","#1976D2","#388E3C","#F57C00","#7B1FA2","#00838F","#C49000","#5D4037","#C2185B","#303F9F","#558B2F","#E64A19"];\nfunction calendarColor(value){let h=0;for(const c of String(value||""))h=((h<<5)-h)+c.charCodeAt(0)|0;return CALENDAR_COLORS[Math.abs(h)%CALENDAR_COLORS.length]}\nfunction editWorkoutTarget(){const [id,dayRaw]=String(state.viewPlanValue||"").split("::"),r=routineById(id),day=Number(dayRaw||0);return {r,day,list:r?.days?.[day]?.items||r?.exercises||[]}}'
      );
      source = source.replace(
        'function currentDraft() { const r=plannedRoutine()||activeRoutine(), key=`${r?.id||"free"}::${r?.activeDay||0}`;if(!state._draft||state._draft.routineKey!==key) state._draft={routineId:r?.id,routineKey:key,date:today(),routineName:r?.name||"Entrenamiento libre",exerciseIndex:0,sets:[],restEndsAt:null}; return state._draft; }',
        'function currentDraft() { const r=plannedRoutine()||activeRoutine(), key=`${r?.id||"free"}::${r?.activeDay||0}`, date=today();if(!state._draft||state._draft.routineKey!==key||state._draft.date!==date) state._draft={routineId:r?.id,routineKey:key,date,routineName:r?.name||"Entrenamiento libre",exerciseIndex:0,sets:[],restEndsAt:null}; return state._draft; }'
      );
      source = source.replace('const count=items().length;', 'const count=sessionItems(draft).length;');
      source = source.replace('const draft=currentDraft(), list=items(r), index=Math.min(draft.exerciseIndex,Math.max(0,list.length-1)), ex=list[index];', 'const draft=currentDraft(), list=sessionItems(draft), index=Math.min(draft.exerciseIndex,Math.max(0,list.length-1)), ex=list[index];');
      source = source.replace(
        'const saved=draft.sets.filter(s=>s.exercise===ex.exercise), completed=saved.length>=Number(ex.sets||1);',
        'const saved=draft.sets.filter(s=>s.exercise===ex.exercise), previous=saved.at(-1)||exerciseHistory(ex.exercise)[0]||null, defaultWeight=previous?.weight??"", defaultReps=previous?.reps??ex.reps??"", completed=saved.length>=Number(ex.sets||1);'
      );
      source = source.replace(
        '<input name="weight" inputmode="decimal" type="number" step="0.5" min="0" required placeholder="0">',
        '<input name="weight" inputmode="decimal" type="number" step="0.5" min="0" required value="${esc(defaultWeight)}" placeholder="0">'
      );
      source = source.replace(
        '<input name="reps" inputmode="numeric" type="number" min="1" required placeholder="${ex.reps}">',
        '<input name="reps" inputmode="numeric" type="number" min="1" required value="${esc(defaultReps)}" placeholder="${ex.reps}">'
      );
      source = source.replace(
        '</div><label class="field">Notas opcionales<input name="notes" maxlength="100" placeholder="Cómo te has sentido"></label>',
        '</div><label class="field">PPM al terminar la serie (opcional)<input name="heartRate" inputmode="numeric" type="number" min="30" max="240" placeholder="SD"></label><div class="ppm-hint">Si lo dejas vacío se guardará como SD · Sin Dato.</div><label class="field">Notas opcionales<input name="notes" maxlength="100" placeholder="Cómo te has sentido"></label>'
      );
      source = source.replace(
        'Serie ${i+1}: ${s.weight} kg × ${s.reps}',
        'Serie ${i+1}: ${s.weight} kg × ${s.reps} · ❤️ ${s.heartRate??"SD"}'
      );
      source = source.replace(
        'draft.sets.push({exercise:ex.exercise,weight:Number(d.get("weight")),reps:Number(d.get("reps")),notes:d.get("notes")||"",at:new Date().toISOString()});',
        'draft.sets.push({exercise:ex.exercise,weight:Number(d.get("weight")),reps:Number(d.get("reps")),heartRate:String(d.get("heartRate")||"").trim()?Number(d.get("heartRate")):null,notes:d.get("notes")||"",at:new Date().toISOString()});'
      );
      source = source.replace(
        '${s.weight} kg × ${s.reps} reps${s.notes?` · ${esc(s.notes)}`:""}',
        '${s.weight} kg × ${s.reps} reps · ❤️ ${s.heartRate??"SD"}${s.notes?` · ${esc(s.notes)}`:""}'
      );
      source = source.replace(
        '<div class="history-table"><div><b>Fecha</b><b>Peso</b><b>Reps</b><b>Notas</b></div>${history.map(x=>`<div><span>${esc(x.date)}</span><span>${x.weight} kg</span><span>${x.reps}</span><span>${esc(x.notes||"—")}</span></div>`).join("")}</div>',
        '<div class="history-table"><div><b>Fecha</b><b>Peso</b><b>Reps</b><b>PPM</b><b>Notas</b></div>${history.map(x=>`<div><span>${esc(x.date)}</span><span>${x.weight} kg</span><span>${x.reps}</span><span>${x.heartRate??"SD"}</span><span>${esc(x.notes||"—")}</span></div>`).join("")}</div>'
      );
      source = source.replace('if(route==="train"){const d=currentDraft(),ex=items()[d.exerciseIndex],info=ex&&exercise(ex.exercise);', 'if(route==="train"){const d=currentDraft(),ex=sessionItems(d)[d.exerciseIndex],info=ex&&exercise(ex.exercise);');
      source = source.replace('if(f.id==="set-form"){const draft=currentDraft(),ex=items()[draft.exerciseIndex];', 'if(f.id==="set-form"){const draft=currentDraft(),ex=sessionItems(draft)[draft.exerciseIndex];');
      source = source.replace(
        '</div><div id="rest-timer" class="rest-timer">',
        '</div>${exercise(ex.exercise).animation?.path?`<button class="movement-cta" data-action="exercise-detail" data-exercise="${esc(ex.exercise)}">▶ Ver movimiento <small>GIF + técnica</small></button>`:`<button class="movement-cta" data-action="exercise-detail" data-exercise="${esc(ex.exercise)}">Ver técnica del ejercicio</button>`}<div id="rest-timer" class="rest-timer">'
      );
      source = source.replace(
        '<button class="icon-button" data-action="exercise-detail" data-exercise="${esc(ex.exercise)}">i</button>',
        ''
      );
      source = source.replace(
        'return `<span class="calendar-entry">${esc(name)}<button aria-label="Quitar ${esc(name)}" data-action="remove-plan-entry" data-date="${iso}" data-value="${esc(value)}">×</button></span>`',
        'return `<span class="calendar-entry" style="--entry-color:${calendarColor(value)}"><button class="calendar-workout" data-action="view-planned-workout" data-date="${iso}" data-value="${esc(value)}">${esc(name)}</button><button aria-label="Quitar ${esc(name)}" data-action="remove-plan-entry" data-date="${iso}" data-value="${esc(value)}">×</button></span>`'
      );
      source = source.replace(
        'function renderGoals() {',
        'function renderPlannerMobile(){const base=new Date(`${state.plannerMonth||today().slice(0,7)+"-01"}T12:00:00`),year=base.getFullYear(),month=base.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0),offset=(first.getDay()+6)%7,monthKey=`${year}-${String(month+1).padStart(2,"0")}`;let selected=state.calendarSelectedDate;if(!selected||!selected.startsWith(monthKey))selected=today().startsWith(monthKey)?today():`${monthKey}-01`;state.calendarSelectedDate=selected;const program=routineById(state.plannerProgramId)||null,programs=state.routines.filter(r=>(r.days||[]).length>1),weekdayNames=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],allChoices=state.routines.flatMap(r=>(r.days||[]).map((d,i)=>({value:`${r.id}::${i}`,label:`${r.name} · ${d.name||`Día ${i+1}`}`}))),options=`<option value="">Añadir entrenamiento…</option>${allChoices.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("")}`;const cells=[];for(let i=0;i<offset;i++)cells.push(`<div class="month-day blank"></div>`);for(let d=1;d<=last.getDate();d++){const iso=localISODate(new Date(year,month,d)),entries=planEntries(iso);cells.push(`<button class="month-day ${iso===today()?"today":""} ${iso===selected?"selected":""}" data-action="select-calendar-day" data-date="${iso}"><b>${d}</b><span class="calendar-dots">${entries.slice(0,4).map(v=>`<i class="calendar-dot" style="background:${calendarColor(v)}"></i>`).join("")}</span></button>`)}const selectedEntries=planEntries(selected),selectedCards=selectedEntries.map(value=>{const [id,dayRaw]=String(value).split("::"),r=routineById(id),day=Number(dayRaw||0),name=r?.days?.[day]?.name||r?.name||"Entreno",count=r?.days?.[day]?.items?.length||r?.exercises?.length||0;return `<div class="day-workout-card"><span class="day-workout-color" style="--workout-color:${calendarColor(value)}"></span><div><b>${esc(name)}</b><span class="muted small">${esc(r?.name||"")} · ${count} ejercicios</span></div><div class="da
