<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VitalPeak" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .calendar-entry{background:var(--entry-color,#2f6f76)!important;border-color:var(--entry-color,#2f6f76)!important;color:#fff!important}
      .calendar-entry button{color:#fff!important}
    </style>
    <title>VitalPeak</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Navegación principal">
      <button data-route="today" class="active" aria-label="Hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></button>
      <button data-route="train" aria-label="Entrenar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4m18-4v4M5 8v8m14-8v8M8 12h8"/><path d="M1 9h4v6H1zm18 0h4v6h-4z"/></svg><span>Entrenar</span></button>
      <button data-route="routines" aria-label="Rutinas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zm0 7h6m-6 4h6m-6 4h4"/></svg><span>Rutinas</span></button>
      <button data-route="progress" aria-label="Progreso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16"/><path d="m7 15 4-4 3 2 5-6"/></svg><span>Progreso</span></button>
      <button data-route="account" aria-label="Cuenta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4.1 3.3-6 8-6s7.3 1.9 8 6"/></svg><span>Cuenta</span></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
    <script src="./catalog-data.js?v=11"></script>
    <script type="module">
      const response = await fetch('./app.js?v=11');
      let source = await response.text();

      source = source.replace(
        'const today = () => new Date().toISOString().slice(0, 10);',
        'const localISODate = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;\nconst today = () => localISODate(new Date());'
      );
      source = source.replace(
        'function isoDate(d) { return new Date(d).toISOString().slice(0,10); }',
        'function isoDate(d) { return localISODate(new Date(d)); }'
      );
      source = source.replace(
        'function plannedRoutine(iso=today()) { const list=plannedRoutines(iso),index=Math.min(Number(state.todaySessionIndex||0),Math.max(0,list.length-1));return list[index]||null; }',
        'function plannedRoutine(iso=today()) { const list=plannedRoutines(iso),index=Math.min(Number(state.todaySessionIndex||0),Math.max(0,list.length-1));return list[index]||null; }\nfunction sessionRoutine(draft=state._draft){if(draft?.routineId){const r=routineById(draft.routineId);if(r){const day=Number(String(draft.routineKey||"").split("::")[1]||0);return {...r,activeDay:day}}}return plannedRoutine(draft?.date||today())||activeRoutine()}\nfunction sessionItems(draft=state._draft){return items(sessionRoutine(draft))}\nconst CALENDAR_COLORS=["#2f6f76","#7a5c9e","#b46a55","#4f7d4f","#9b6a2f","#446f9e","#8a5468","#4f8580"];\nfunction calendarColor(value){let h=0;for(const c of String(value||""))h=((h<<5)-h)+c.charCodeAt(0)|0;return CALENDAR_COLORS[Math.abs(h)%CALENDAR_COLORS.length]}'
      );
      source = source.replace(
        'function currentDraft() { const r=plannedRoutine()||activeRoutine(), key=`${r?.id||"free"}::${r?.activeDay||0}`;if(!state._draft||state._draft.routineKey!==key) state._draft={routineId:r?.id,routineKey:key,date:today(),routineName:r?.name||"Entrenamiento libre",exerciseIndex:0,sets:[],restEndsAt:null}; return state._draft; }',
        'function currentDraft() { const r=plannedRoutine()||activeRoutine(), key=`${r?.id||"free"}::${r?.activeDay||0}`, date=today();if(!state._draft||state._draft.routineKey!==key||state._draft.date!==date) state._draft={routineId:r?.id,routineKey:key,date,routineName:r?.name||"Entrenamiento libre",exerciseIndex:0,sets:[],restEndsAt:null}; return state._draft; }'
      );
      source = source.replace('const count=items().length;', 'const count=sessionItems(draft).length;');
      source = source.replace('const draft=currentDraft(), list=items(r), index=Math.min(draft.exerciseIndex,Math.max(0,list.length-1)), ex=list[index];', 'const draft=currentDraft(), list=sessionItems(draft), index=Math.min(draft.exerciseIndex,Math.max(0,list.length-1)), ex=list[index];');
      source = source.replace(
        'const saved=draft.sets.filter(s=>s.exercise===ex.exercise), completed=saved.length>=Number(ex.sets||1);',
        'const saved=draft.sets.filter(s=>s.exercise===ex.exercise), previous=saved.at(-1)||exerciseHistory(ex.exercise)[0]||null, defaultWeight=previous?.weight??"", defaultReps=previous?.reps??ex.reps??"", completed=saved.length>=Number(ex.sets||1);'
      );
      source = source.replace(
        '<input name="weight" inputmode="decimal" type="number" step="0.5" min="0" required placeholder="0">',
        '<input name="weight" inputmode="decimal" type="number" step="0.5" min="0" required value="${esc(defaultWeight)}" placeholder="0">'
      );
      source = source.replace(
        '<input name="reps" inputmode="numeric" type="number" min="1" required placeholder="${ex.reps}">',
        '<input name="reps" inputmode="numeric" type="number" min="1" required value="${esc(defaultReps)}" placeholder="${ex.reps}">'
      );
      source = source.replace('if(route==="train"){const d=currentDraft(),ex=items()[d.exerciseIndex],info=ex&&exercise(ex.exercise);', 'if(route==="train"){const d=currentDraft(),ex=sessionItems(d)[d.exerciseIndex],info=ex&&exercise(ex.exercise);');
      source = source.replace('if(f.id==="set-form"){const draft=currentDraft(),ex=items()[draft.exerciseIndex];', 'if(f.id==="set-form"){const draft=currentDraft(),ex=sessionItems(draft)[draft.exerciseIndex];');
      source = source.replace('return `<span class="calendar-entry">${esc(name)}<button aria-label="Quitar ${esc(name)}" data-action="remove-plan-entry" data-date="${iso}" data-value="${esc(value)}">×</button></span>`', 'return `<span class="calendar-entry" style="--entry-color:${calendarColor(value)}">${esc(name)}<button aria-label="Quitar ${esc(name)}" data-action="remove-plan-entry" data-date="${iso}" data-value="${esc(value)}">×</button></span>`');
      source = source.replace('<img src="./icon-cover.png" alt="VitalPeak">', '<img src="./icons/icon-192.svg" alt="VitalPeak">');

      const blob = new Blob([source], {type:'text/javascript'});
      const url = URL.createObjectURL(blob);
      try { await import(url); } finally { URL.revokeObjectURL(url); }
    </script>
  </body>
</html>
