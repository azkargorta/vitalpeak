<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VitalPeak" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>VitalPeak</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Navegación principal">
      <button data-route="today" class="active"><span>⌂</span>Hoy</button>
      <button data-route="train"><span>⌁</span>Entrenar</button>
      <button data-route="routines"><span>☷</span>Rutinas</button>
      <button data-route="progress"><span>⌁</span>Progreso</button>
      <button data-route="account"><span>◉</span>Cuenta</button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
