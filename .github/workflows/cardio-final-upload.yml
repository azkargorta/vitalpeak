name: Instalar cardio definitivo

on:
  push:
    branches: [cardio-final-upload]
    paths:
      - 'mobile/cardio-upload/_READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cardio-final-upload
          fetch-depth: 0
      - name: Instalar imágenes JPG y renovar caché
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/cardio-images
          mkdir -p mobile/cardio-images
          tar -xzf mobile/cardio-upload/cardio300.tar.gz -C mobile/cardio-images
          for name in cinta-de-correr caminata-cinta-inclinacion bicicleta-estatica bicicleta-aire bicicleta-eliptica remo-ergometro escaladora saltar-comba carrera-exterior caminata-rapida; do
            test -s "mobile/cardio-images/${name}.jpg"
          done
          python - <<'PY'
          from pathlib import Path
          names = ['cinta-de-correr','caminata-cinta-inclinacion','bicicleta-estatica','bicicleta-aire','bicicleta-eliptica','remo-ergometro','escaladora','saltar-comba','carrera-exterior','caminata-rapida']
          for filename in ['scripts/export_mobile_catalog.py','mobile/sw.js','mobile/cardio-catalog.js']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              for n in names:
                  s=s.replace(f'cardio-images/{n}.webp', f'cardio-images/{n}.jpg')
              s=s.replace('vitalpeak-mobile-v54','vitalpeak-mobile-v55')
              p.write_text(s,encoding='utf-8')
          PY
          rm -rf mobile/cardio-upload
          rm -f .github/workflows/cardio-final-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/cardio-images mobile/sw.js mobile/cardio-catalog.js scripts/export_mobile_catalog.py mobile/cardio-upload .github/workflows/cardio-final-upload.yml
          git commit -m 'Sustituye imágenes cardio por JPG definitivos'
          git push origin HEAD:cardio-final-upload
