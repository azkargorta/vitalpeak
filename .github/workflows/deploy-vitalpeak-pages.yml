name: Publicar VitalPeak móvil en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "exercise_images/sequences/**"
      - "app/routine_templates.py"
      - "app/exercise_catalog.py"
      - "data/base_exercises.txt"
      - "scripts/export_mobile_catalog.py"
      - ".github/workflows/deploy-vitalpeak-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitalpeak-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar imágenes cardio definitivas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged=(mobile/cardio-images/*.webp.base64-tmp)
          if ((${#staged[@]})); then
            for src in "${staged[@]}"; do
              dst="${src%.base64-tmp}"
              base64 --decode "$src" > "$dst"
              test -s "$dst"
              file "$dst" | grep -qi "web/p"
            done

            rm -f mobile/cardio-images/*.webp.base64-tmp
            rm -f mobile/cardio-images/bicicleta-aire.jpg.b64
            rm -f mobile/cardio-images/.probe.txt
            rm -f mobile/cardio-images/*.svg

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/cardio-images
            if ! git diff --cached --quiet; then
              git commit -m "Materializa imágenes cardio definitivas"
              git push origin HEAD:main
            fi
          fi

      - name: Regenerar catálogo móvil
        run: |
          python scripts/export_mobile_catalog.py
          test -s mobile/catalog-data.js
          grep -q "window.VITALPEAK_CATALOG" mobile/catalog-data.js

      - name: Preparar la app y sus GIFs
        run: |
          mkdir -p _site
          cp -R mobile/. _site/
          mkdir -p _site/exercise-gifs
          cp -R exercise_images/sequences/. _site/exercise-gifs/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
