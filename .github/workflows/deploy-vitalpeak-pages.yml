name: Publicar VitalPeak móvil en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "exercise_images/sequences/**"
      - "app/routine_templates.py"
      - "app/exercise_catalog.py"
      - "app/training_volume.py"
      - "app/exercise_selector.py"
      - "app/routine_engine.py"
      - "data/base_exercises.txt"
      - "data/exercise_metadata.json"
      - "scripts/export_mobile_catalog.py"
      - ".github/workflows/deploy-vitalpeak-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitalpeak-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar imágenes cardio definitivas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged=(mobile/cardio-images/*.webp.base64-tmp)
          if ((${#staged[@]})); then
            python - <<'PY'
          from pathlib import Path
          import base64

          for src in sorted(Path('mobile/cardio-images').glob('*.webp.base64-tmp')):
              raw = ''.join(src.read_text(encoding='utf-8').split())
              raw += '=' * (-len(raw) % 4)
              data = base64.b64decode(raw, validate=False)
              dst = Path(str(src).removesuffix('.base64-tmp'))
              dst.write_bytes(data)
              if len(data) < 1000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Imagen WebP inválida: {src.name}')
              print(f'{src.name} -> {dst.name}: {len(data)} bytes')
          PY

            for img in mobile/cardio-images/*.webp; do
              test -s "$img"
              file "$img" | grep -qi "web/p"
            done

            rm -f mobile/cardio-images/*.webp.base64-tmp
            rm -f mobile/cardio-images/bicicleta-aire.jpg.b64
            rm -f mobile/cardio-images/.probe.txt
            rm -f mobile/cardio-images/*.svg

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/cardio-images
            if ! git diff --cached --quiet; then
              git commit -m "Materializa imágenes cardio definitivas"
              git push origin HEAD:main
            fi
          fi

      - name: Regenerar catálogo móvil
        run: |
          python scripts/export_mobile_catalog.py
          test -s mobile/catalog-data.js
          grep -q "window.VITALPEAK_CATALOG" mobile/catalog-data.js
          grep -q '"volumeEngine"' mobile/catalog-data.js
          grep -q '"exerciseSelector"' mobile/catalog-data.js
          grep -q '"routineEngine"' mobile/catalog-data.js
          cat >> mobile/catalog-data.js <<'JS'
          
          ;(async()=>{
            const scripts=[
              "./routines-transition-guard.js?v=1",
              "./routines-render-gate.js?v=4",
              "./routine-generator-ui.js?v=1",
              "./coach-anchor-fix.js?v=5",
              "./routine-navigation-fix.js?v=1",
              "./routines-accordion.js?v=4",
              "./routines-redesign.js?v=5",
              "./routines-ui-repair.js?v=3",
              "./routine-active-ux.js?v=2",
              "./personal-routines-actions.js?v=2",
              "./progression-engine-v1.js?v=1",
              "./training-session-ui.js?v=1",
              "./training-entry-assist.js?v=1",
              "./training-rir-progression.js?v=1",
              "./training-set-management.js?v=1",
              "./training-completion-history.js?v=2",
              "./calendar-recurrence-ui.js?v=3",
              "./progress-engine-v1.js?v=1",
              "./muscle-volume-engine-v1.js?v=1",
              "./coach-intelligence.js?v=2",
              "./coach-routine-adaptation.js?v=1",
              "./progress-redesign.js?v=3",
              "./progress-intelligence-ui.js?v=2",
              "./muscle-volume-ui.js?v=2",
              "./progress-logo-fix.js?v=1",
              "./progress-management.js?v=4",
              "./progress-weight-stable.js?v=1",
              "./account-progress-share-stable.js?v=2",
              "./push-config.js?v=2",
              "./training-notifications.js?v=4",
              "./training-notifications-fix.js?v=1"
            ];
            for(const src of scripts){
              await new Promise((resolve,reject)=>{
                const s=document.createElement("script");
                s.src=src;
                s.async=false;
                s.onload=resolve;
                s.onerror=()=>reject(new Error(`No se pudo cargar ${src}`));
                document.head.appendChild(s);
              });
            }
          })().catch(console.error);
          JS
          grep -q 'routines-transition-guard.js' mobile/catalog-data.js
          grep -q 'routines-render-gate.js' mobile/catalog-data.js
          grep -q 'routine-generator-ui.js' mobile/catalog-data.js
          grep -q 'coach-anchor-fix.js' mobile/catalog-data.js
          grep -q 'routine-navigation-fix.js' mobile/catalog-data.js
          grep -q 'routines-accordion.js' mobile/catalog-data.js
          grep -q 'routines-redesign.js' mobile/catalog-data.js
          grep -q 'routines-ui-repair.js' mobile/catalog-data.js
          grep -q 'routine-active-ux.js' mobile/catalog-data.js
          grep -q 'personal-routines-actions.js' mobile/catalog-data.js
          grep -q 'progression-engine-v1.js' mobile/catalog-data.js
          grep -q 'training-session-ui.js' mobile/catalog-data.js
          grep -q 'training-entry-assist.js' mobile/catalog-data.js
          grep -q 'training-rir-progression.js' mobile/catalog-data.js
          grep -q 'training-set-management.js' mobile/catalog-data.js
          grep -q 'training-completion-history.js' mobile/catalog-data.js
          grep -q 'calendar-recurrence-ui.js' mobile/catalog-data.js
          grep -q 'progress-engine-v1.js' mobile/catalog-data.js
          grep -q 'muscle-volume-engine-v1.js' mobile/catalog-data.js
          grep -q 'coach-intelligence.js' mobile/catalog-data.js
          grep -q 'coach-routine-adaptation.js' mobile/catalog-data.js
          grep -q 'progress-redesign.js' mobile/catalog-data.js
          grep -q 'progress-intelligence-ui.js' mobile/catalog-data.js
          grep -q 'muscle-volume-ui.js' mobile/catalog-data.js
          grep -q 'progress-logo-fix.js' mobile/catalog-data.js
          grep -q 'progress-management.js' mobile/catalog-data.js
          grep -q 'progress-weight-stable.js' mobile/catalog-data.js
          grep -q 'account-progress-share-stable.js' mobile/catalog-data.js
          grep -q 'push-config.js' mobile/catalog-data.js
          grep -q 'training-notifications.js' mobile/catalog-data.js
          grep -q 'training-notifications-fix.js' mobile/catalog-data.js

      - name: Preparar la app y sus GIFs
        run: |
          mkdir -p _site
          cp -R mobile/. _site/
          mkdir -p _site/exercise-gifs
          cp -Rn exercise_images/sequences/. _site/exercise-gifs/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
