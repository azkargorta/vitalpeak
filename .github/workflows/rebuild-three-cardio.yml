name: Reconstruir tres imágenes cardio

on:
  push:
    branches: [cardio-assets-final2]
    paths:
      - '.asset-upload/READY3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cardio-assets-final2
          fetch-depth: 0
      - name: Decodificar imágenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/cardio-media
          for name in saltar-comba carrera-exterior caminata-rapida; do
            cat .asset-upload/${name}.*.b64 | tr -d '\n\r ' | base64 -d > mobile/cardio-media/${name}.webp
            test -s mobile/cardio-media/${name}.webp
            file mobile/cardio-media/${name}.webp
          done
          rm -f .asset-upload/READY3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/cardio-media .asset-upload/READY3
          git commit -m 'Reconstruye tres imágenes cardio'
          git push origin HEAD:cardio-assets-final2
