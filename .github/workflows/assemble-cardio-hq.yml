name: Ensamblar imágenes cardio HQ

on:
  push:
    branches: [cardio-hq-fix]
    paths:
      - 'mobile/cardio-upload/_READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir imágenes JPG
        shell: bash
        run: |
          set -euo pipefail
          cat mobile/cardio-upload/part-* > /tmp/cardio-hq.b64
          base64 -d /tmp/cardio-hq.b64 > /tmp/cardio-hq.tar.gz
          mkdir -p mobile/cardio-images
          tar -xzf /tmp/cardio-hq.tar.gz -C mobile/cardio-images
          rm -rf mobile/cardio-upload
      - name: Guardar imágenes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/cardio-images mobile/cardio-upload
          git commit -m 'Añade JPG cardio definitivos'
          git push
